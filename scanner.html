<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Guard Scanner – Life of Gautam Buddha</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --saffron: #e67e22;
      --saffron-dark: #d35400;
      --bg: #0f172a;
      --card: rgba(255,255,255,0.06);
      --text: #ffffff;
      --text-light: #94a3b8;
      --border: rgba(255,255,255,0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header p {
      color: var(--text-light);
      font-size: 0.9rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 18px;
    }

    .row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .row > div {
      flex: 1;
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-light);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.07);
      color: white;
      font-size: 1rem;
      outline: none;
    }

    select option {
      background: #1e293b;
      color: white;
    }

    #reader {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      margin: 12px 0 18px;
      background: #000;
    }

    .message {
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 14px;
      display: none;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #86efac;
    }

    .already {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid #eab308;
      color: #fde047;
    }

    .error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--saffron), var(--saffron-dark));
      color: white;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-light);
      margin-top: 12px;
    }

    .btn-outline:hover {
      border-color: #64748b;
      color: white;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: var(--text-light);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Guard Scanner</h1>
      <p>Life of Gautam Buddha</p>
    </div>

    <div class="card">
      <div class="status-bar">
        <div><span class="status-dot"></span> Scanner Ready</div>
        <div id="gateLabel">Gate 1</div>
      </div>

      <div class="row">
        <div>
          <label>Gate</label>
          <select id="gateSelect" onchange="updateGateLabel()">
            <option value="1">Gate 1</option>
            <option value="2">Gate 2</option>
          </select>
        </div>
        <div>
          <label>Guard Name</label>
          <input type="text" id="guardName" placeholder="Your name" value="Guard">
        </div>
      </div>

      <div id="reader"></div>

      <div class="message success" id="successMsg"></div>
      <div class="message already" id="alreadyMsg"></div>
      <div class="message error" id="errorMsg"></div>

      <button class="btn btn-outline" onclick="goBack()">← Back to Guard Panel</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbypaTr-JAhmGVRjSwILEyYRZ-kgNLG7hWT6XzfeqWK6GISsVdjEWhF-BUTDQ9tU-zk/exec";
    let html5QrCode = null;

    // Protect the page
    if (sessionStorage.getItem("guardAuthenticated") !== "true") {
      window.location.href = "login.html";
    }

    function updateGateLabel() {
      document.getElementById("gateLabel").textContent = "Gate " + document.getElementById("gateSelect").value;
    }

    function goBack() {
      if (html5QrCode) {
        html5QrCode.stop().catch(() => {});
      }
      window.location.href = "guard.html";
    }

    function hideMessages() {
      document.getElementById("successMsg").style.display = "none";
      document.getElementById("alreadyMsg").style.display = "none";
      document.getElementById("errorMsg").style.display = "none";
    }

    function startScanner() {
      html5QrCode = new Html5Qrcode("reader");

      Html5Qrcode.getCameras().then(cameras => {
        if (!cameras || cameras.length === 0) {
          showError("No camera found on this device");
          return;
        }

        // Prefer back camera
        const backCamera = cameras.find(c => 
          c.label.toLowerCase().includes("back") || 
          c.label.toLowerCase().includes("rear")
        ) || cameras[cameras.length - 1];

        const config = {
          fps: 10,
          qrbox: { width: 250, height: 250 },
          aspectRatio: 1.0
        };

        html5QrCode.start(
          backCamera.id,
          config,
          onScanSuccess,
          () => {} // ignore continuous errors
        ).catch(err => {
          showError("Could not start camera. Please allow camera permission.");
        });

      }).catch(err => {
        showError("Camera permission denied. Please allow access and refresh.");
      });
    }

    function showError(msg) {
      const el = document.getElementById("errorMsg");
      el.textContent = msg;
      el.style.display = "block";
    }

    async function onScanSuccess(decodedText) {
      // Pause scanner to avoid multiple scans
      html5QrCode.pause(true);
      hideMessages();

      const gate = document.getElementById("gateSelect").value;
      const guardName = document.getElementById("guardName").value.trim() || "Guard";

      try {
        const url = `${API_URL}?action=checkIn&regID=${encodeURIComponent(decodedText)}&gate=${gate}&guardName=${encodeURIComponent(guardName)}`;
        
        const res = await fetch(url);
        const result = await res.json();

        if (result.success) {
          const msg = document.getElementById("successMsg");
          msg.innerHTML = `
            <strong>✅ Check-in Successful</strong><br>
            ${result.fullName}<br>
            ID: ${result.registrationID}<br>
            ${result.time}
          `;
          msg.style.display = "block";
        } 
        else if (result.message === "Already checked in") {
          const msg = document.getElementById("alreadyMsg");
          msg.innerHTML = `
            <strong>⚠️ Already Checked In</strong><br>
            ${result.fullName}<br>
            Gate ${result.gate}
          `;
          msg.style.display = "block";
        } 
        else {
          showError(result.message || "Invalid QR code");
        }
      } catch (err) {
        showError("Network error. Please try again.");
      }

      // Resume after 2.8 seconds
      setTimeout(() => {
        html5QrCode.resume();
        hideMessages();
      }, 2800);
    }

    // Start scanner when page loads
    startScanner();
  </script>
</body>
</html>
